project_id = "league-cloud-coach"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:5173/"
additional_redirect_urls = ["http://127.0.0.1:5173/"]
enable_signup = true

[auth.external.google]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

# Public share capabilities are checked in the handler; owner actions also
# verify the user JWT with Supabase Auth before calling owner RPCs.
[functions.stream]
verify_jwt = false

# Owner JWT and enabled membership are checked before any Riot request.
[functions.riot]
verify_jwt = false
